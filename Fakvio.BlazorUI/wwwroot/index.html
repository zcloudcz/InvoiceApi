<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <!-- Roboto font for MudBlazor Material Design components -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!-- MudBlazor CSS framework -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <!-- Quill rich-text editor CSS (used by Blazored.TextEditor for template editing) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
    <!-- Application styles from the shared RCL (Fakvio.UI.Shared/wwwroot/css/app.css).
         Path is "/css/app.css" (not "_content/...") because UI.Shared has
         StaticWebAssetBasePath="/" which maps RCL wwwroot to the site root. -->
    <link rel="stylesheet" href="css/app.css" />
    <!-- Scoped CSS for Blazor components — includes both host and RCL scoped styles -->
    <link rel="stylesheet" href="Fakvio.BlazorUI.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- PWA manifest — enables "Add to Home Screen" on mobile browsers.
         Contains app name, icons, theme color, and display mode (standalone = no browser UI). -->
    <link href="manifest.webmanifest" rel="manifest" />
    <!-- iOS PWA meta tags — Safari doesn't fully read manifest.webmanifest, needs these extras -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fakvio" />
    <link rel="apple-touch-icon" href="icon-512.png" />
    <!-- Theme color for browser UI (address bar color on Android, etc.) -->
    <meta name="theme-color" content="#594ae2" />
    <title>Fakvio</title>
</head>

<!-- Initial dark background prevents white flash before Blazor WASM loads.
     Once MudThemeProvider renders, it takes over body background via CSS class.
     The inline style is removed by Blazor startup (MudThemeProvider sets mud-theme-dark/light). -->
<body>
    <!-- Blazor WASM root component — App.razor is mounted here by Program.cs -->
    <div id="app">
        <!-- Loading indicator shown while WASM runtime downloads (~2-5 MB first load).
             Dark background + grey logo matches the default dark mode theme so there is
             no jarring flash when the Blazor app takes over rendering. -->
        <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background:#1e1e2e;">
            <img src="images/logo-grey.png" alt="Fakvio" style="width:80px;height:80px;margin-bottom:16px;" />
            <h3 style="color:#aaa;font-family:Roboto,sans-serif;">Loading...</h3>
        </div>
    </div>

    <!-- Error UI shown when an unhandled exception crashes the WASM runtime -->
    <div id="blazor-error-ui"
         style="background:lightyellow;bottom:0;box-shadow:0 -1px 2px rgba(0,0,0,0.2);display:none;left:0;padding:0.6rem 1.25rem 0.7rem 1.25rem;position:fixed;width:100%;z-index:1000;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss" style="cursor:pointer;">Dismiss</a>
    </div>

    <!-- JS helper for culture persistence — used by Program.cs (startup) and LanguageSwitcher.
         Direct localStorage.getItem/setItem calls through JS interop can have "this" binding issues
         in some WASM runtimes. These wrapper functions guarantee correct binding. -->
    <script>
        window.blazorCulture = {
            get: function () { return localStorage.getItem('culture'); },
            set: function (value) { localStorage.setItem('culture', value); }
        };
    </script>

    <!-- Blazor WebAssembly runtime script (NOT blazor.web.js which is for Server) -->
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- PWA service worker registration — caches WASM bundle + static assets for offline access.
         In development: service-worker.js (pass-through, no caching).
         In production: replaced by service-worker.published.js (offline-first with versioned cache). -->
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <!-- MudBlazor JavaScript interop (dialogs, scroll, etc.) -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <!-- Quill rich-text editor and Blazored.TextEditor integration scripts -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="_content/Blazored.TextEditor/quill-blot-formatter.min.js"></script>
    <script src="_content/Blazored.TextEditor/Blazored-BlazorQuill.js"></script>
    <!-- Fix: Blazored.TextEditor's createQuill does NOT store the Quill instance
         on the DOM element (__quill), AND loadQuillHTMLContent can be called before
         createQuill finishes. This patch:
         1. Overrides createQuill to store the instance
         2. Overrides ALL reader/writer functions to resolve __quill lazily
            by walking the DOM to find the .ql-editor child (Quill always creates it) -->
    <script>
        (function () {
            // Helper: find the Quill instance for a container element.
            // Quill stores itself on the direct child div it creates,
            // so we check the element and its children.
            function getQuill(el) {
                if (el.__quill) return el.__quill;
                // Quill 1.x sets __quill on the element passed to constructor.
                // But Blazored passes the wrapper div, Quill attaches to child.
                var children = el.querySelectorAll('.ql-container');
                for (var i = 0; i < children.length; i++) {
                    if (children[i].__quill) {
                        el.__quill = children[i].__quill;
                        return el.__quill;
                    }
                }
                return null;
            }

            window.QuillFunctions.createQuill = function (
                quillElement, toolBar, readOnly,
                placeholder, theme, formats, debugLevel) {

                Quill.register('modules/blotFormatter', QuillBlotFormatter.default);

                var options = {
                    debug: debugLevel,
                    modules: { toolbar: toolBar, blotFormatter: {} },
                    placeholder: placeholder,
                    readOnly: readOnly,
                    theme: theme
                };
                if (formats) options.formats = formats;

                var q = new Quill(quillElement, options);
                quillElement.__quill = q;
            };

            window.QuillFunctions.getQuillHTML = function (quillElement) {
                var q = getQuill(quillElement);
                return q ? q.root.innerHTML : '';
            };

            window.QuillFunctions.getQuillText = function (quillElement) {
                var q = getQuill(quillElement);
                return q ? q.getText() : '';
            };

            window.QuillFunctions.getQuillContent = function (quillElement) {
                var q = getQuill(quillElement);
                return q ? JSON.stringify(q.getContents()) : '{}';
            };

            window.QuillFunctions.loadQuillContent = function (quillElement, quillContent) {
                var q = getQuill(quillElement);
                if (q) q.setContents(JSON.parse(quillContent), 'api');
            };

            window.QuillFunctions.loadQuillHTMLContent = function (quillElement, quillHTMLContent) {
                var q = getQuill(quillElement);
                if (q) q.root.innerHTML = quillHTMLContent;
            };

            window.QuillFunctions.enableQuillEditor = function (quillElement, mode) {
                var q = getQuill(quillElement);
                if (q) q.enable(mode);
            };

            window.QuillFunctions.insertQuillImage = function (quillElement, imageURL) {
                var q = getQuill(quillElement);
                if (!q) return;
                var idx = q.getSelection() ? q.getSelection().index : 0;
                q.updateContents(new (Quill.import('delta'))().retain(idx).insert({ image: imageURL }, { alt: imageURL }));
            };

            window.QuillFunctions.insertQuillText = function (quillElement, text) {
                var q = getQuill(quillElement);
                if (!q) return;
                var sel = q.getSelection();
                var idx = sel ? sel.index : 0;
                var len = sel ? sel.length : 0;
                q.deleteText(idx, len);
                q.insertText(idx, text);
            };
        })();
    </script>
    <!-- Custom JS for file download from the shared RCL.
         Path is "/js/download.js" (not "_content/...") because UI.Shared has
         StaticWebAssetBasePath="/" which maps RCL wwwroot to the site root. -->
    <script src="js/download.js"></script>
</body>

</html>
