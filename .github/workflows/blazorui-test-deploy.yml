name: BlazorUI Deploy to Azure Static Web Apps (TEST-ENV)

on:
  # Manual trigger from the Actions tab — handy for redeploying without a new commit.
  workflow_dispatch:

  # The test environment tracks the TEST-ENV branch. Production (GitHub Pages via
  # blazorui-deploy.yml) tracks master and is deliberately left untouched by this file.
  push:
    branches: [ TEST-ENV ]

permissions:
  contents: read

# One test deploy at a time; let an in-progress one finish rather than cancel it,
# so the SWA never ends up serving a half-uploaded bundle.
concurrency:
  group: "swa-test"
  cancel-in-progress: false

env:
  # Test backend = the separate Function App provisioned in #289.
  # The WASM bundle reads ApiSettings:BaseUrl from a static file, so this URL
  # has to be baked in at publish time — there is no server to inject it later.
  TEST_API_BASE_URL: 'https://zcloudinvoicingapi-test.azurewebsites.net'

  # Test MCP HTTP host (#241). Separate from the API on purpose — since #240 they are two
  # applications on two addresses, and deriving one from the other is the bug #363 fixed.
  #
  # The custom domain, not the azurewebsites.net one: it carries its own managed certificate
  # (site-scoped — DEVGUIDE §9.1 has the why), so HTTPS holds, and a stable address means a
  # client config pasted today survives the host being rebuilt or renamed.
  TEST_MCP_BASE_URL: 'https://mcp-test.fakvio.cz'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          # Must match the TargetFramework (net10.0) declared in the csproj files
          dotnet-version: '10.x'

      - name: Point the WASM bundle at the test backend
        run: |
          CONFIG=Fakvio.BlazorUI/wwwroot/appsettings.json

          # Rewritten BEFORE publish on purpose. Publish also emits precompressed
          # siblings (appsettings.json.br / .gz) and a static host may serve those
          # instead of the plain file; patching only the plain file after publish would
          # leave the production URL sitting in the compressed copies.
          #
          # The substitution is scoped to the "ApiSettings" block on purpose: appsettings.json
          # holds more than one "BaseUrl" key (McpSettings got its own in #363), and an
          # unscoped pattern would rewrite the MCP host's address to the API's as well —
          # which is exactly the bug #363 exists to fix. The range runs from the section
          # header to that section's own closing brace.
          # The ^[[:space:]]* anchor matches only the active setting; the commented-out
          # localhost line starts with "//" and is left alone.
          sed -i -E "/\"ApiSettings\"/,/^[[:space:]]*\}/ s|^([[:space:]]*)\"BaseUrl\": \".*\"|\1\"BaseUrl\": \"${TEST_API_BASE_URL}\"|" "$CONFIG"

          # Fail fast on both ways this can go wrong — hence a count, not a grep -q, which
          # would pass on either. Zero occurrences: the sed matched nothing (appsettings.json
          # restructured) and a silent no-op would ship a *test* frontend talking to
          # *production*. More than one: the sed escaped its section and overwrote another
          # section's BaseUrl with the API address. Exactly one is the only correct outcome.
          test "$(grep -cF "${TEST_API_BASE_URL}" "$CONFIG")" -eq 1

          # The MCP host address the Integrations page pastes into the "remote" client snippet.
          # Scoped and counted exactly like ApiSettings above, and for the same reason — the two
          # sections each own a "BaseUrl" and must never be rewritten with each other's value.
          #
          # The committed value is an empty string (production has no MCP host deployed yet), so
          # the pattern has to match "" as well as a real URL — hence ".*" rather than ".\+".
          sed -i -E "/\"McpSettings\"/,/^[[:space:]]*\}/ s|^([[:space:]]*)\"BaseUrl\": \".*\"|\1\"BaseUrl\": \"${TEST_MCP_BASE_URL}\"|" "$CONFIG"
          test "$(grep -cF "${TEST_MCP_BASE_URL}" "$CONFIG")" -eq 1

          # Same idea for the environment name: the UI paints the app bar pink and shows a
          # TEST chip when this is anything but "production", so nobody edits production
          # believing it is the test system (Fakvio.UI.Shared/Services/UiEnvironment.cs).
          # Scoped and counted for the same reason as above — "Name" is a generic key, so the
          # next section that grows one must not be rewritten by accident.
          sed -i -E "/\"Environment\"/,/^[[:space:]]*\}/ s|^([[:space:]]*)\"Name\": \"production\"|\1\"Name\": \"test\"|" "$CONFIG"
          test "$(grep -cF '"Name": "test"' "$CONFIG")" -eq 1

          cat "$CONFIG"

      - name: Publish BlazorUI (WASM)
        run: |
          dotnet publish Fakvio.BlazorUI/Fakvio.BlazorUI.csproj \
            -c Release \
            -o ./publish

      # skip_app_build: the bundle is already built above by the .NET SDK, so Oryx
      # must not try to detect and rebuild it. app_location therefore points at the
      # finished artifact. Deep links are handled by wwwroot/staticwebapp.config.json
      # (navigationFallback) — the SWA equivalent of the 404.html trick used on Pages.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_TEST }}
          action: 'upload'
          app_location: 'publish/wwwroot'
          api_location: ''
          output_location: ''
          skip_app_build: true
