# Fakvio MCP server — packs the stdio distribution and deploys the HTTP host.
#
# One build, one publish output, both hosting modes: Fakvio.McpServer picks its transport at
# startup from FAKVIO_MCP_TRANSPORT ("stdio" by default, "http" starts Kestrel on /mcp), so the
# same binaries that get installed as the `fakvio-mcp` dotnet tool are the ones deployed to
# Azure. There is deliberately no second build with different switches — two builds would be two
# things that can drift apart.
#
# Docs for the Azure Web App Deploy action: https://github.com/Azure/webapps-deploy

name: MCP server - pack tool and deploy HTTP host

on:
  # Same branches as the other deploy workflows: TEST-ENV carries the test environment,
  # master the production one. No path filter — Fakvio.McpServer builds on top of
  # Fakvio.Contracts and Fakvio.Domain, and a filter that forgets one of those ships a
  # stale server. A superfluous two-minute run is the cheaper mistake.
  push:
    branches:
      - master
      - TEST-ENV
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x' # must match the TargetFramework (net10.0) in Fakvio.McpServer.csproj

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish the MCP server (the artifact that serves both modes)
        shell: bash
        run: |
          dotnet publish ./Fakvio.McpServer/Fakvio.McpServer.csproj \
            --configuration Release \
            --output ./publish

      - name: Smoke test the published host
        shell: bash
        run: |
          set -euo pipefail
          # Starting the process is the only way to prove the ASP.NET Core shared framework
          # actually resolves: the framework is loaded by the host *before* Main runs, so a
          # missing Microsoft.AspNetCore.App fails here and nowhere earlier.
          #
          # An unknown transport is the one input that makes the server exit on purpose
          # (Program.cs returns 1), so this needs no token, no API and no network. stdin is
          # closed so a regression that falls back to stdio hangs the step for zero seconds
          # instead of six hours.
          FAKVIO_MCP_TRANSPORT=__invalid__ ./publish/Fakvio.McpServer </dev/null && rc=0 || rc=$?

          # Exactly 1, not merely non-zero: a framework-load failure also exits non-zero, and
          # that is the failure this step exists to catch.
          if [ "${rc}" -ne 1 ]; then
            echo "::error::Expected exit code 1 from the unknown-transport guard, got ${rc}."
            exit 1
          fi

      - name: Pack the stdio distribution (dotnet tool)
        shell: bash
        run: |
          dotnet pack ./Fakvio.McpServer/Fakvio.McpServer.csproj \
            --configuration Release \
            --output ./nupkg

      - name: Assert the packed tool still requires the ASP.NET Core shared framework
        shell: bash
        run: |
          set -euo pipefail
          # ModelContextProtocol.AspNetCore carries a FrameworkReference to
          # Microsoft.AspNetCore.App, which makes the ASP.NET Core runtime a hard requirement of
          # the packaged tool even for stdio users (README "Požadavky", DEVGUIDE §4.9).
          # That is documented, so it must not change silently: if a package bump ever drops the
          # reference the docs become wrong, and if the reference disappears while the code still
          # uses WebApplication the tool breaks at startup on every machine. Either way, fail here.
          #
          # Checked on the .nupkg rather than ./publish because that is the artifact people
          # install; both files are generated by the same build from the same csproj.
          #
          # Read into a variable instead of piping straight into grep: `grep -q` exits on the
          # first match, which hands unzip a SIGPIPE, and `pipefail` would then fail the step
          # on the *successful* case.
          RUNTIMECONFIG=$(unzip -p ./nupkg/Fakvio.McpServer.*.nupkg \
            'tools/net10.0/any/Fakvio.McpServer.runtimeconfig.json')
          echo "${RUNTIMECONFIG}"

          if ! grep -q 'Microsoft.AspNetCore.App' <<< "${RUNTIMECONFIG}"; then
            echo "::error::The packed tool no longer declares Microsoft.AspNetCore.App. Update README 'Požadavky' and DEVGUIDE §4.9 if this is intended."
            exit 1
          fi

      - name: Upload the HTTP host artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-http-host
          path: ./publish

      - name: Upload the dotnet tool package
        uses: actions/upload-artifact@v4
        with:
          name: mcp-tool-nupkg
          path: ./nupkg/*.nupkg

  deploy-http-test:
    needs: build
    runs-on: ubuntu-latest

    # Test environment only. Production has no MCP HTTP host resource yet — when it gets one,
    # add a sibling job with the production OIDC secrets, the way the Functions workflows are
    # split per environment (§9.1).
    #
    # MCP_HTTP_APP_NAME is a repository *variable* (not a secret) holding the App Service name,
    # expected value `fakvio-mcp-test`. It doubles as the on/off switch: until a human creates
    # the Web App and grants the existing TEST app registration access to it (hand-back on
    # #241), the variable is unset and this job is skipped instead of failing every TEST-ENV
    # push on a resource that does not exist.
    if: github.ref_name == 'TEST-ENV' && vars.MCP_HTTP_APP_NAME != ''

    permissions:
      id-token: write # required for requesting the OIDC JWT
      contents: read

    # One deploy at a time, and let a running one finish rather than cancel it half-uploaded.
    concurrency:
      group: "mcp-http-test"
      cancel-in-progress: false

    steps:
      - name: Download the HTTP host artifact
        uses: actions/download-artifact@v4
        with:
          # The very same output the build job smoke-tested — not a rebuild.
          name: mcp-http-host
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          # The per-environment app registration already used by testenv_zcloudinvoicingapi.yml
          # (federated credential trusts the TEST-ENV branch only). One registration per
          # environment, not per resource — the human hand-back on #241 asks for its role
          # assignment to be extended to the MCP Web App rather than for a new set of secrets.
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_TEST }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_TEST }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_TEST }}

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.MCP_HTTP_APP_NAME }}
          package: ./publish

      - name: Verify the deployed host answers on /mcp
        shell: bash
        run: |
          set -euo pipefail
          # A request with no Authorization header is rejected by McpApiKeyMiddleware without
          # touching the API, so 401 proves the host booted, the gate is in front of the
          # endpoints, and /mcp is mapped — with no credential in the workflow. Anything else
          # (200 = gate missing, 404 = wrong route, 5xx = did not start) is a failed deploy.
          #
          # The URL comes from the deploy action rather than being composed by hand, because
          # newly created App Services get a region-suffixed default hostname.
          URL="${{ steps.deploy.outputs.webapp-url }}"

          # --retry-all-errors covers the cold start: the first hit after a deploy can land
          # while the site is still warming up and answer 5xx.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                   --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 \
                   "${URL%/}/mcp")

          if [ "${CODE}" != "401" ]; then
            echo "::error::POST ${URL%/}/mcp answered ${CODE}, expected 401 from the API-key gate."
            exit 1
          fi
