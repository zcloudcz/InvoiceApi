# Fakvio MCP server — packs the stdio distribution and deploys the HTTP host.
#
# One build, one publish output, both hosting modes: Fakvio.McpServer picks its transport at
# startup from FAKVIO_MCP_TRANSPORT ("stdio" by default, "http" starts Kestrel on /mcp), so the
# same binaries that get installed as the `fakvio-mcp` dotnet tool are the ones deployed to
# Azure App Service (Linux web app on the shared B1 plan, startup command
# `dotnet Fakvio.McpServer.dll`, FAKVIO_MCP_TRANSPORT=http as an App Setting). There is deliberately no second build with different switches — two builds would be two
# things that can drift apart.
#
# Docs for the Azure Web App Deploy action: https://github.com/Azure/webapps-deploy

name: MCP server - pack tool and deploy HTTP host

on:
  # Same branch as the other deploy workflow: master is the production one. No path filter — Fakvio.McpServer builds on top of
  # Fakvio.Contracts and Fakvio.Domain, and a filter that forgets one of those ships a
  # stale server. A superfluous two-minute run is the cheaper mistake.
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x' # must match the TargetFramework (net10.0) in Fakvio.McpServer.csproj

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish the MCP server (the artifact that serves both modes)
        shell: bash
        run: |
          dotnet publish ./Fakvio.McpServer/Fakvio.McpServer.csproj \
            --configuration Release \
            --output ./publish

      - name: Smoke test the published host
        shell: bash
        run: |
          set -euo pipefail
          # Starting the process is the only way to prove the ASP.NET Core shared framework
          # actually resolves: the framework is loaded by the host *before* Main runs, so a
          # missing Microsoft.AspNetCore.App fails here and nowhere earlier.
          #
          # An unknown transport is the one input that makes the server exit on purpose
          # (Program.cs returns 1), so this needs no API and no network. stdin is closed so a
          # regression that falls back to stdio hangs the step for zero seconds instead of six
          # hours.
          #
          # FAKVIO_API_TOKEN is a placeholder, and it is what makes the assert below mean
          # anything: stdio mode exits 1 too when the token is missing (Program.cs), so without
          # it a regression that swallows __invalid__ and falls back to stdio would also exit 1
          # and pass. With the token set, that fallback exits 0 and the step goes red. The value
          # is never sent anywhere — nothing does an outgoing request at startup.
          FAKVIO_API_TOKEN=dummy FAKVIO_MCP_TRANSPORT=__invalid__ ./publish/Fakvio.McpServer </dev/null && rc=0 || rc=$?

          # Exactly 1, not merely non-zero: a framework-load failure also exits non-zero, and
          # that is the failure this step exists to catch.
          if [ "${rc}" -ne 1 ]; then
            echo "::error::Expected exit code 1 from the unknown-transport guard, got ${rc}."
            exit 1
          fi

      - name: Pack the stdio distribution (dotnet tool)
        shell: bash
        run: |
          dotnet pack ./Fakvio.McpServer/Fakvio.McpServer.csproj \
            --configuration Release \
            --output ./nupkg

      - name: Assert the packed tool still requires the ASP.NET Core shared framework
        shell: bash
        run: |
          set -euo pipefail
          # ModelContextProtocol.AspNetCore carries a FrameworkReference to
          # Microsoft.AspNetCore.App, which makes the ASP.NET Core runtime a hard requirement of
          # the packaged tool even for stdio users (README "Požadavky", DEVGUIDE §4.9).
          # That is documented, so it must not change silently: if a package bump ever drops the
          # reference the docs become wrong, and if the reference disappears while the code still
          # uses WebApplication the tool breaks at startup on every machine. Either way, fail here.
          #
          # Checked on the .nupkg rather than ./publish because that is the artifact people
          # install; both files are generated by the same build from the same csproj.
          #
          # Read into a variable instead of piping straight into grep: `grep -q` exits on the
          # first match, which hands unzip a SIGPIPE, and `pipefail` would then fail the step
          # on the *successful* case.
          RUNTIMECONFIG=$(unzip -p ./nupkg/Fakvio.McpServer.*.nupkg \
            'tools/net10.0/any/Fakvio.McpServer.runtimeconfig.json')
          echo "${RUNTIMECONFIG}"

          if ! grep -q 'Microsoft.AspNetCore.App' <<< "${RUNTIMECONFIG}"; then
            echo "::error::The packed tool no longer declares Microsoft.AspNetCore.App. Update README 'Požadavky' and DEVGUIDE §4.9 if this is intended."
            exit 1
          fi

      - name: Upload the HTTP host artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-http-host
          path: ./publish

      - name: Upload the dotnet tool package
        uses: actions/upload-artifact@v4
        with:
          name: mcp-tool-nupkg
          path: ./nupkg/*.nupkg

  deploy-http-prod:
    needs: build
    runs-on: ubuntu-latest

    # Production deploy of the HTTP host (the test environment was retired on 2026-09-10).
    #
    # MCP_HTTP_APP_NAME_PROD is a repository *variable* (not a secret) holding the web app
    # name (expected value `fakvio-mcp-web`); while it is unset this job is skipped instead
    # of failing every master push on a resource that does not exist.
    if: github.ref_name == 'master' && vars.MCP_HTTP_APP_NAME_PROD != ''

    permissions:
      id-token: write # required for requesting the OIDC JWT
      contents: read

    concurrency:
      group: "mcp-http-prod"
      cancel-in-progress: false

    steps:
      - name: Download the HTTP host artifact
        uses: actions/download-artifact@v4
        with:
          name: mcp-http-host
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          # The production app registration already used by master_zcloudinvoicingapi.yml. One
          # registration per environment, not per resource — its role assignment has to be
          # extended to the MCP Web App (ADMINGUIDE §9), no new secrets are needed.
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_71CB3DED09D246528906A346340AC1F8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0F744DC7C56040999B540311235A4E45 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0A2C19BC7D294FFA80F06B93F1D614E4 }}

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.MCP_HTTP_APP_NAME_PROD }}
          package: ./publish

      - name: Verify the deployed host answers on /mcp
        shell: bash
        run: |
          set -euo pipefail
          # No Authorization header must answer 401, which proves the host booted and the
          # API-key gate stands in front of the pipeline without this workflow carrying any
          # credential. Platform-level authentication (Easy Auth) must stay off here — it would
          # answer 401 before the app is reached and keep this step green on a host that never
          # booted. It does NOT prove /mcp is mapped: the gate short-circuits every path.
          URL="${{ steps.deploy.outputs.webapp-url }}"

          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                   --retry 20 --retry-all-errors --retry-delay 30 --max-time 30 \
                   "${URL%/}/mcp")

          if [ "${CODE}" != "401" ]; then
            echo "::error::POST ${URL%/}/mcp answered ${CODE}, expected 401 from the API-key gate."
            exit 1
          fi

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest

    # Production releases only. The stdio distribution is what users install
    # (`dotnet tool install -g Fakvio.McpServer`), so it follows master only —
    # a non-release build must never become the package the public pulls.
    if: github.ref_name == 'master'

    permissions:
      # nuget.org Trusted Publishing: the job proves its identity with a GitHub OIDC token
      # instead of a long-lived API key stored as a repo secret.
      id-token: write
      contents: read

    steps:
      - name: Download the dotnet tool package
        uses: actions/download-artifact@v4
        with:
          # The package the build job already asserted still carries the ASP.NET Core
          # FrameworkReference — not a rebuild, so what gets published is what got checked.
          name: mcp-tool-nupkg
          path: ./nupkg

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget-login
        # Exchanges this run's OIDC token for a short-lived (1 h) API key. The matching
        # trusted-publishing policy on nuget.org (owner `zahy`) allows only this repo
        # (zcloudcz/InvoiceApi) and this workflow file, and only the Fakvio.McpServer package.
        # No secret to rotate: if the policy is missing or wrong, this step fails the job red.
        uses: NuGet/login@v1
        with:
          user: zahy

      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          # --skip-duplicate is what makes this safe to run on every master push: the version
          # lives in Fakvio.McpServer.csproj and is bumped by hand, so a merge that did not
          # touch it re-pushes an already-published version. Without the flag nuget.org answers
          # 409 and the build goes red on a merge that did nothing wrong; with it, the push is
          # a no-op and a real bump still ships.
          #
          # The consequence to know: forgetting the bump means the fix reaches CI artifacts and
          # nobody else, silently. The version bump belongs in the same PR as the change.
          dotnet nuget push ./nupkg/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${NUGET_API_KEY}" \
            --skip-duplicate
