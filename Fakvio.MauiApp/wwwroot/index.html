<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <base href="/" />
    <!-- Roboto font for MudBlazor Material Design components -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!-- MudBlazor CSS framework -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <!-- Quill rich-text editor CSS (used by Blazored.TextEditor for template editing) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
    <!-- Application styles from the shared RCL -->
    <link rel="stylesheet" href="_content/Fakvio.UI.Shared/css/app.css" />
    <!-- Scoped CSS for Blazor components -->
    <link rel="stylesheet" href="Fakvio.MauiApp.styles.css" />
    <title>Fakvio</title>
</head>

<body>
    <!-- Blazor root component — App.razor from Fakvio.UI.Shared is mounted here -->
    <div id="app">
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;">
            <div>
                <h3 style="color:#666;font-family:Roboto,sans-serif;">Loading...</h3>
            </div>
        </div>
    </div>

    <!-- Error UI shown when an unhandled exception occurs -->
    <div id="blazor-error-ui"
         style="background:lightyellow;bottom:0;box-shadow:0 -1px 2px rgba(0,0,0,0.2);display:none;left:0;padding:0.6rem 1.25rem 0.7rem 1.25rem;position:fixed;width:100%;z-index:1000;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss" style="cursor:pointer;">Dismiss</a>
    </div>

    <!-- JS helper for culture persistence — localStorage works in WebView2/WKWebView -->
    <script>
        window.blazorCulture = {
            get: function () { return localStorage.getItem('culture'); },
            set: function (value) { localStorage.setItem('culture', value); }
        };
    </script>

    <!-- MAUI Blazor Hybrid uses blazor.webview.js (NOT blazor.webassembly.js).
         This script bootstraps Blazor inside the native WebView control. -->
    <script src="_framework/blazor.webview.js"></script>
    <!-- NOTE: No service worker registration — PWA features are not used in native MAUI apps -->
    <!-- MudBlazor JavaScript interop -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <!-- Quill rich-text editor and Blazored.TextEditor integration scripts -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="_content/Blazored.TextEditor/quill-blot-formatter.min.js"></script>
    <script src="_content/Blazored.TextEditor/Blazored-BlazorQuill.js"></script>
    <!-- Fix: Blazored.TextEditor's createQuill does NOT store the Quill instance
         on the DOM element, causing "Cannot read properties of undefined" errors.
         This patch stores the instance so subsequent API calls work. -->
    <script>
        (function () {
            var originalCreateQuill = window.QuillFunctions.createQuill;
            window.QuillFunctions.createQuill = function (
                quillElement, toolBar, readOnly,
                placeholder, theme, formats, debugLevel) {
                originalCreateQuill(quillElement, toolBar, readOnly,
                    placeholder, theme, formats, debugLevel);
                if (!quillElement.__quill) {
                    quillElement.__quill = Quill.find(quillElement);
                }
            };
        })();
    </script>
    <!-- Custom JS for file download from the shared RCL -->
    <script src="_content/Fakvio.UI.Shared/js/download.js"></script>
</body>

</html>
